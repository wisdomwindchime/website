<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCEFC4"/>
      <stop offset="100%" stop-color="#A9D486"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF6C9"/>
      <stop offset="55%" stop-color="#FCE04D"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </radialGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bgGreen)"/>

  <!-- ICON, scaled and shifted left -->
  <g transform="translate(40,10) scale(0.62)">
    <!-- mount -->
    <rect x="140" y="70" width="120" height="14" rx="7" fill="#D98E3F"/>
    <circle cx="200" cy="77" r="4" fill="#FFF8E0"/>

    <!-- strings -->
    <line x1="140" y1="84" x2="140" y2="114" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>
    <line x1="170" y1="84" x2="170" y2="99" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="84" x2="200" y2="84" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>
    <line x1="230" y1="84" x2="230" y2="99" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>
    <line x1="260" y1="84" x2="260" y2="114" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>

    <!-- tubes -->
    <rect x="134" y="114" width="12" height="90" rx="6" fill="#F2C230"/>
    <rect x="164" y="99" width="12" height="110" rx="6" fill="#F2C230"/>
    <rect x="194" y="84" width="12" height="140" rx="6" fill="#F2C230"/>
    <rect x="224" y="99" width="12" height="110" rx="6" fill="#F2C230"/>
    <rect x="254" y="114" width="12" height="90" rx="6" fill="#F2C230"/>

    <!-- clapper -->
    <line x1="200" y1="224" x2="200" y2="248" stroke="#8A7B5E" stroke-width="2" opacity="0.6"/>
    <g stroke="#D98E3F" stroke-width="2.5" stroke-linecap="round">
      <line x1="200" y1="248" x2="200" y2="240"/>
      <line x1="200" y1="276" x2="200" y2="284"/>
      <line x1="172" y1="262" x2="180" y2="262"/>
      <line x1="220" y1="262" x2="228" y2="262"/>
      <line x1="180" y1="242" x2="186" y2="248"/>
      <line x1="214" y1="276" x2="220" y2="282"/>
      <line x1="220" y1="248" x2="214" y2="254"/>
      <line x1="186" y1="276" x2="180" y2="282"/>
    </g>
    <circle cx="200" cy="262" r="13" fill="url(#sunGlow)"/>
  </g>

  <!-- WORDMARK -->
  <text x="330" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="5" fill="#2B2B2B" font-weight="600">WISDOM</text>
  <text x="330" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="3" fill="#B65C1F" font-weight="600">WINDCHIME</text>
  <text x="332" y="232" font-family="Georgia, serif" font-style="italic" font-size="20" letter-spacing="1" fill="#5A5A4A">a little wisdom can change the way you see life</text>

  <!-- hairline -->
  <line x1="330" y1="248" x2="820" y2="248" stroke="#D98E3F" stroke-width="1.5" opacity="0.4"/>
</svg>
